<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" aria-labelledby="catan-icon-title" viewBox="0 0 48 48">
  <title id="catan-icon-title">Catan Online</title>
  <defs>
    <!-- Warm land tile: fields gold falling away to hills clay. -->
    <linearGradient id="tile" x1="24" x2="24" y1="1" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eabc46"/>
      <stop offset=".5" stop-color="#d1922f"/>
      <stop offset="1" stop-color="#b5651d"/>
    </linearGradient>
  </defs>

  <!-- A pointy-top hex, the board's one unmistakable shape, run nearly full-bleed
       so the mark still fills the 16px favicon box. -->
  <path fill="url(#tile)" stroke="#1b1510" stroke-width="2" stroke-linejoin="round"
        d="M24 1.6 43.6 12.8v22.4L24 46.4 4.4 35.2V12.8Z"/>

  <!-- Settlement, parchment over a heavy ink outline so the silhouette holds when tiny. -->
  <path fill="#fbf4e4" stroke="#1b1510" stroke-width="2" stroke-linejoin="round"
        d="M24 10.8 38.6 26H35v11H13V26H9.4Z"/>
</svg>
